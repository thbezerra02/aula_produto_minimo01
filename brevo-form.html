<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --accent: #f2aa32;
      --text: #f5f7f4;
      --muted: #a9b6b7;
      --field: #ffffff;
      --field-text: #101719;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    form {
      display: grid;
      gap: 12px;
      width: 100%;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: var(--field);
      color: var(--field-text);
      font-size: 0.95rem;
      outline: none;
    }

    input::placeholder {
      color: #748081;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(242, 170, 50, 0.20);
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #17100a;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .message {
      display: none;
      margin: 0;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .message.is-error {
      display: block;
      background: rgba(255, 92, 92, 0.13);
      border: 1px solid rgba(255, 92, 92, 0.35);
      color: #ffd6d6;
    }

    .message.is-success {
      display: block;
      background: rgba(47, 191, 96, 0.14);
      border: 1px solid rgba(47, 191, 96, 0.38);
      color: #c9f7da;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <form id="sib-form" method="POST" target="_top" action="https://840b08c5.sibforms.com/serve/MUIFAEkODNP2dWdUJKC-jtdrAWBxbLBIqm2hsfIqvOWjlzVzT3aRXihL99Qe9aqLbwostLxd1JeJ_os5XnmVT0skdXM7wOBt67ierH4L2VguaPRieNzke5jTKK6jRVA0cBa877VBodGGcWbtoscDxcTeFoph5AH7zvGruZ4iIKNivHD6TFY8kHEbD7lkwbQQMzRKDn77tYc-63l9" data-type="subscription">
    <input type="email" id="EMAIL" name="EMAIL" autocomplete="email" placeholder="Seu melhor e-mail" required>
    <input type="hidden" name="WHATSAPP__COUNTRY_CODE" value="+55">
    <input type="tel" id="WHATSAPP" name="WHATSAPP" autocomplete="tel" placeholder="WhatsApp com DDD" required>
    <button type="submit">Acessar aula gratuita agora</button>
    <p class="message" id="form-message" role="alert" aria-live="polite"></p>
    <input type="text" name="email_address_check" value="" style="display:none">
    <input type="hidden" name="locale" value="pt">
    <p class="hint">100% online e gratuito.</p>
  </form>
  <script>
    const form = document.getElementById('sib-form');
    const phoneInput = document.getElementById('WHATSAPP');
    const message = document.getElementById('form-message');
    const button = form.querySelector('button');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message is-${type}`;
    }

    function clearMessage() {
      message.textContent = '';
      message.className = 'message';
    }

    function getPhoneDigits(value) {
      let digits = value.replace(/\D/g, '');

      if (digits.startsWith('55') && digits.length > 11) {
        digits = digits.slice(2);
      }

      return digits;
    }

    function isValidBrazilianPhone(value) {
      const digits = getPhoneDigits(value);
      const ddd = Number(digits.slice(0, 2));

      return (digits.length === 10 || digits.length === 11) && ddd >= 11 && ddd <= 99;
    }

    phoneInput.addEventListener('input', () => {
      clearMessage();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage();

      if (!form.reportValidity()) {
        return;
      }

      if (!isValidBrazilianPhone(phoneInput.value)) {
        showMessage('Confira o WhatsApp. Use DDD + número, por exemplo: 11999999999.', 'error');
        phoneInput.focus();
        return;
      }

      const originalButtonText = button.textContent;
      button.disabled = true;
      button.textContent = 'Enviando...';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          redirect: 'follow'
        });

        const contentType = response.headers.get('content-type') || '';
        const responseText = await response.text();

        if (response.redirected && response.url) {
          window.top.location.href = response.url;
          return;
        }

        if (contentType.includes('application/json') || responseText.trim().startsWith('{')) {
          const data = JSON.parse(responseText);

          const redirectUrl = data.redirect || data.redirect_url || data.url;

          if (data.success && redirectUrl) {
            window.top.location.href = redirectUrl;
            return;
          }

          if (data.success) {
            showMessage('Cadastro realizado. Abrindo a aula...', 'success');
            return;
          }

          const whatsappError = data.errors && data.errors.WHATSAPP;
          const emailError = data.errors && data.errors.EMAIL;

          if (whatsappError) {
            showMessage('Esse WhatsApp já está cadastrado ou foi digitado incorretamente. Confira o número e tente novamente.', 'error');
            phoneInput.focus();
            return;
          }

          if (emailError) {
            showMessage('Confira o e-mail informado e tente novamente.', 'error');
            return;
          }
        }

        if (!response.ok) {
          showMessage('Não foi possível concluir o cadastro agora. Confira os dados e tente novamente.', 'error');
          return;
        }

        showMessage('Cadastro enviado. Se a aula não abrir automaticamente, tente novamente em alguns segundos.', 'success');
      } catch (error) {
        showMessage('Não foi possível validar o cadastro agora. Confira o WhatsApp e tente novamente.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = originalButtonText;
      }
    });
  </script>
</body>
</html>
